<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проекты Ольги</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f0f13;
    --card: #1a1a22;
    --card-hover: #22222c;
    --text: #f2f2f5;
    --muted: #9a9aa5;
    --accent: #ff5533;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .wrap { max-width: 640px; width: 100%; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p.sub { color: var(--muted); margin: 0 0 32px; }
  .cards { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid #2a2a34;
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s, transform 0.15s;
  }
  a.card:hover { background: var(--card-hover); transform: translateY(-2px); }
  .card .icon { font-size: 28px; margin-bottom: 10px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Проекты</h1>
    <p class="sub">Личные страницы, размещённые через GitHub Pages</p>
    <div class="cards">
      <a class="card" href="Persona/">
        <div class="icon">👤</div>
        <h2>Персона</h2>
        <p>Личная страница-визитка</p>
      </a>
      <a class="card" href="Game/">
        <div class="icon">🏁</div>
        <h2>Retro Racer</h2>
        <p>8-битная браузерная гонка</p>
      </a>
    </div>
  </div>
</body>
</html>
